<body>

          <a href="html/reservas.html" class="btn-reservar-top">RESERVAR</a>
        </div>


        <!-- Menú lateral oculto -->
        <div id="sideMenu" class="side-menu">
          <div class="menu-header"></div>
          <ul class="menu-links">
            <li><a href="/index.html">INICIO</a></li>
            <li><a href="/html/menu.html">MENÚ</a></li>
            <li><a href="/html/bebidas.html">BEBIDAS</a></li>
            <li><a href="#EVENTOS">EVENTOS</a></li>
            <li><a href="/html/reservas.html" class="btn-reservar">RESERVAR AHORA</a></li>
          </ul>

          <div class="social-icons">
            <a href="https://facebook.com" target="_blank" aria-label="Facebook">
              <i class="fab fa-facebook-f"></i>
            </a>
            <a href="https://instagram.com" target="_blank" aria-label="Instagram">
              <i class="fab fa-instagram"></i>
            </a>

              <i class="fab fa-whatsapp"></i>
            </a>
          </div>


        </div>
      </div>
      <!-- Branding central -->

    </section>
    <section class="nombre">
      <div class="header__texto">
        <h2>RESERVAS</h2>
      </div>
    </section>



  </header>

<form id="form-reserva">

  <!-- Paso 1: Fecha -->
  <div class="paso" id="paso-fecha">
  <h2>Selecciona la fecha</h2>
  <input type="date" id="fecha" name="fecha" required>
  <div class="botones">
      <button type="button">         </button>
    <button type="button" onclick="siguientePaso('paso-hora')">Continuar</button>
  </div>
</div>


  <!-- Paso 2: Hora (controlado por JS) -->
  <div class="paso oculto" id="paso-hora">
    <h2>Selecciona la hora</h2>
    <div id="contenedor-horas">
              <select id="hora">
          <option value="" disabled selected>Seleccionar hora</option>
        </select>
    </div> <!-- Aquí tu JS inyecta los botones -->
    <div class="botones">
      <button type="button" onclick="anteriorPaso('paso-fecha')">Atrás</button>
      <button type="button" onclick="siguientePaso('paso-ubicacion')">Continuar</button>
    </div>
  </div>

  <!-- Paso 3: Ubicación -->
  <div class="paso oculto" id="paso-ubicacion">
    <h2>Selecciona la ubicación</h2>
    <select id="ubicacion" onchange="actualizarMesas()" required>
      <option value="salon">Salón</option>
      <option value="terraza">Terraza</option>
    </select>
    <div class="botones">
      <button type="button" onclick="anteriorPaso('paso-hora')">Atrás</button>
      <button type="button" onclick="siguientePaso('paso-mesa')">Continuar</button>
    </div>
  </div>

  <!-- Paso 4: Mesa -->
  <div class="paso oculto" id="paso-mesa">
    <h2>Selecciona la mesa</h2>
    <select id="mesa" required></select>
    <div class="botones">
      <button type="button" onclick="anteriorPaso('paso-ubicacion')">Atrás</button>
      <button type="button" onclick="siguientePaso('paso-personas')">Continuar</button>
    </div>
  </div>

  <!-- Paso 5: Personas -->
  <div class="paso oculto" id="paso-personas">
    <h2>¿Cuántas personas?</h2>
    <input type="number" id="personas" min="1" max="20" required>
    <div class="botones">
      <button type="button" onclick="anteriorPaso('paso-mesa')">Atrás</button>
      <button type="button" onclick="siguientePaso('paso-decoracion')">Continuar</button>
    </div>
  </div>

  <!-- Paso 6: Decoración -->
  <div class="paso oculto" id="paso-decoracion">
    <h2>Plan de decoración</h2>
    <select id="decoracion" required>
      <option value="" disabled selected>Seleccionar</option>
      <option value="plata">Ninguno</option>
      <option value="plata">Plata</option>
      <option value="oro">Oro</option>
      <option value="diamante">Diamante</option>
    </select>
    <div class="botones">
      <button type="button" onclick="anteriorPaso('paso-personas')">Atrás</button>
      <button type="button" onclick="siguientePaso('paso-observaciones')">Continuar</button>
    </div>
  </div>

  <!-- Paso 7: Observaciones -->
  <div class="paso oculto" id="paso-observaciones">
    <h2>Observaciones</h2>
    <textarea id="observaciones" placeholder="Opcional"></textarea>
    <div class="botones">
      <button type="button" onclick="anteriorPaso('paso-decoracion')">Atrás</button>
     <button type="button" onclick="siguientePaso('paso-nombre')">Continuar</button>
    </div>
  </div>

  <!-- Paso 8: Nombre -->
<div class="paso oculto" id="paso-nombre">
  <h2>¿Quién hace la reserva?</h2>
  <input type="text" id="nombre" placeholder="Ej: Ana Rodríguez" required>
  <div class="botones">
    <button type="button" onclick="anteriorPaso('paso-decoracion')">Atrás</button>
     <button type="button" id="btn-reservar">Reservar</button>
  </div>
</div>

</form>

  <hr class="separador">

  <footer class="footer">
    <div class="contenedor">
      <div class="barra">
        <a class="logo" href="/index.html">
          <h1 class="logo__nombre">Zagrada Restaurante <span class="logo__bold">y Café</span></h1>
        </a>
        <nav class="navegacion">
          <a href="/index.html#nosotros" class="navegacion__enlace">Nosotros</a>
          <a href="/html/menu.html" class="navegacion__enlace">Menú</a>
          <a href="/html/bebidas.html" class="navegacion__enlace">Bebidas</a>
        </nav>
      </div>
    </div>
  </footer>

  <script>
    function toggleMenu() {
      document.getElementById('sideMenu').classList.toggle('active');
    }

</body>

</html>

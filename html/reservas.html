<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zagrada Restautante y Café</title>
    <link rel="stylesheet" href="../css/vendor/normalize.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&family=PT+Sans:ital,wght@0,400;0,700;1,400;1,700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/reservas.css">
</head>

<body>

    <header class="header">
        
        <div class="contenedor">
            <div class="barra">
                <a class="logo" href="index.html">
                    <h1 class="logo__nombre">Zagrada Restaurante <span class="logo__bold">y Café</span></h1>
                </a>


            </div>
        </div>
        <div class="header__texto">

                <nav class="navegacion">
                    <a href="nosotros.html" class="navegacion__enlace">Nosotros</a>
                    <a href="menu.html" class="navegacion__enlace">Menú</a>
                    <a href="reservas.html" class="navegacion__enlace">Reservas</a>

                </nav>


        </div>



<div class="barra-reserva">
  <div class="grupo">
    <label>Tamaño del grupo</label>
    <div class="contador">
      <button id="menos">-</button>
      <span id="cantidad">2</span>
      <button id="mas">+</button>
    </div>
  </div>

  <div class="fecha">
    <label>Fecha</label>
    <input type="date" value="2025-08-12">
  </div>

  <div class="hora">
    <label>Hora</label>
    <input type="time" value="20:00">
  </div>

  <div class="piso">
    <label>Piso</label>
    <select id="piso">
      <option value="tercero">Tercer piso</option>
      <option value="terraza">Terraza</option>
    </select>
  </div>

  <div class="mesa">
    <label>Mesa</label>
    <select id="mesa">
      <!-- Se llenará dinámicamente -->
    </select>
  </div>

  <button class="buscar">Reservar</button>
</div>



    </header>




</body>

</html>

<body>

 <header class="header">

          <a href="html/reservas.html" class="btn-reservar-top">RESERVAR</a>
        </div>


        <!-- Menú lateral oculto -->
        <div id="sideMenu" class="side-menu">
          <div class="menu-header"></div>

            <li><a href="/index.html">INICIO</a></li>

          <div class="social-icons">

      <!-- Branding central -->

    </section>
    <section class="nombre">
      <div class="header__texto">
        <h2>RESERVAS</h2>
      </div>
    </section>


    
  </header>

  <main class="contenedor">
  
      <hr class="separador">

  <div id="seccion-reservas"> <!--   Reservas  -->
    <div class="reserva-horizontal">
      <h2>Reservar Mesa</h2>
      <form>
        <input type="date" id="fecha" name="fecha" required placeholder="Fecha">
        <select id="hora">
          <option value="" disabled selected>Seleccionar hora</option>
        </select>
        <select id="ubicacion" onchange="actualizarMesas()">
          <option value="salon">Salón</option>
          <option value="terraza">Terraza</option>
        </select>
        <select id="mesa"></select>
        <input type="number" id="personas" min="1" max="20" placeholder="Personas">
        <select id="decoracion">
          <option value="" disabled selected>Planes de Decoración</option>
          <option value="plata">Ninguno</option>
          <option value="plata">Plata</option>
          <option value="oro">Oro</option>
          <option value="diamante">Diamante</option>
        </select>
        <textarea id="observaciones" placeholder="Observaciones (opcional)"></textarea>
        <button type="submit">Reservar</button>
      </form>
    </div>
  </div>




  </main>

  <hr class="separador">

  <footer class="footer">
    <div class="contenedor">
      <div class="barra">
        <a class="logo" href="/index.html">

        </a>
        <nav class="navegacion">

    </div>
  </footer>

      document.getElementById('sideMenu').classList.toggle('active');
    }

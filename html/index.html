<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zagrada Restaurante y Café</title>
  <link rel="stylesheet" href="../css/vendor/normalize.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;700&family=PT+Sans:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

  <header class="header">
    <div class="contenedor">
      <div class="barra">
        <a class="logo" href="index.html">
          <h1 class="logo__nombre">Zagrada Restaurante <span class="logo__bold">y Café</span></h1>
        </a>
        <nav class="navegacion">
          <a href="nosotros.html" class="navegacion__enlace">Nosotros</a>
          <a href="menu.html" class="navegacion__enlace">Menú</a>
          <a href="reservas.html" class="navegacion__enlace">Reservas</a>
        </nav>
      </div>
    </div>
    <div class="header__texto">
      <h2>La comida es Zagrada</h2>
    </div>
  </header>

  <div id="seccion-reservas">
    <div class="reserva-horizontal">
      <h2>Reservar Mesa</h2>
      <form>
        <input type="date" id="fecha">
        <select id="hora"></select>
        <select id="ubicacion" onchange="actualizarMesas()">
          <option value="salon">Salón</option>
          <option value="terraza">Terraza</option>
        </select>
        <select id="mesa"></select>
        <input type="number" id="personas" min="1" max="20" placeholder="Personas">
        <select id="decoracion">
          <option value="plata">Plata</option>
          <option value="oro">Oro</option>
          <option value="diamante">Diamante</option>
        </select>
        <textarea id="observaciones" placeholder="Observaciones (opcional)"></textarea>
        <button type="submit">Reservar</button>
      </form>
    </div>
  </div>

  <div class="contenedor planes-decoracion">
<section class="planes-decoracion contenedor">
  <h3 class="centrar-texto">Planes de Decoración</h3>
  <div class="planes-grid">
    <div class="plan-card">
      <img src="../img/planplata.jpg" alt="Plan Plata">
    </div>
    <div class="plan-card">
      <img src="../img/planoro.jpg" alt="Plan Oro">
    </div>
    <div class="plan-card">
      <img src="../img/plandiamante.jpg" alt="Plan Diamante">
    </div>
  </div>
</section>
  </div>

  <footer class="footer">
    <div class="contenedor">
      <div class="barra">
        <a class="logo" href="index.html">
          <h1 class="logo__nombre">Zagrada Restaurante <span class="logo__bold">y Café</span></h1>
        </a>
        <nav class="navegacion">
          <a href="nosotros.html" class="navegacion__enlace">Nosotros</a>
          <a href="menu.html" class="navegacion__enlace">Menú</a>
          <a href="reservas.html" class="navegacion__enlace">Reservas</a>
        </nav>
      </div>
    </div>
  </footer>

  <script src="../js/reservas.js"></script>
</body>
</html>
